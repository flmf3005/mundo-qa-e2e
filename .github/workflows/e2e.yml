name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * *' # todo dia, 06:00 em Brasília
  workflow_dispatch:
    inputs:
      scope:
        description: 'O que rodar'
        type: choice
        default: readonly
        options: [readonly, all]

permissions:
  contents: read

# Execuções que criam dados (agendada e manual com "all") entram numa fila, uma por vez, para que a limpeza
# da noite nunca apague dados de outra execução em andamento. As somente-leitura não escrevem nada,
# então cada uma tem o próprio grupo e não espera ninguém.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.scope == 'all') && 'e2e-writes' || format('e2e-readonly-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # Defina a variável de repositório BASE_URL para apontar para outro ambiente.
  BASE_URL: ${{ vars.BASE_URL || 'https://mundoqa-staging.onrender.com' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # O download de pacotes do apt já travou por 20 min (job cancelado por timeout): limita cada tentativa e repete.
      - name: Instala o navegador
        run: |
          for attempt in 1 2 3; do
            timeout 8m npx playwright install --with-deps ${{ matrix.project }} && exit 0
            echo "Instalação falhou ou travou (tentativa $attempt de 3)"
          done
          exit 1

      # push e pull request rodam só os testes que não criam dados no ambiente.
      # O agendamento diário e a execução manual com "all" rodam tudo (inclui @writes).
      - name: Testes
        env:
          # Não usar string vazia no ternário (`cond && '' || x` sempre cai no x): valores não vazios.
          SCOPE: ${{ (github.event_name == 'schedule' || inputs.scope == 'all') && 'all' || 'readonly' }}
        run: |
          echo "Escopo: $SCOPE"
          if [ "$SCOPE" = "all" ]; then
            # 1 worker: o cadastro da API aceita 5 por minuto por IP e cada teste @writes cria uma conta.
            npx playwright test --project=${{ matrix.project }} --workers=1
          else
            npx playwright test --project=${{ matrix.project }} --grep-invert @writes
          fi

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Só no agendamento noturno, depois dos testes: apaga as contas E2E que eles criaram (e as que sobraram
  # de execuções manuais). Precisa do secret DATABASE_URL e da variável CLEANUP_DB_HOST (veja o README).
  # `!cancelled()` limpa mesmo quando algum teste falhou, que é quando mais sobra dado.
  cleanup:
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLEANUP_DB_HOST: ${{ vars.CLEANUP_DB_HOST }}
      # Idade mínima (em horas) do que será apagado. 0 apaga tudo que casa com o padrão E2E.
      CLEANUP_OLDER_THAN_HOURS: ${{ vars.CLEANUP_OLDER_THAN_HOURS || '0' }}
    steps:
      - name: Confere a configuração
        run: |
          missing=0
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret DATABASE_URL não definido (Settings > Secrets and variables > Actions)"; missing=1; fi
          if [ -z "$CLEANUP_DB_HOST" ]; then echo "::error::Variável CLEANUP_DB_HOST não definida (host do banco, ex.: ep-xxxx.neon.tech)"; missing=1; fi
          exit $missing

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apaga as contas E2E
        run: npm run cleanup -- --apply --confirm-host="$CLEANUP_DB_HOST" --older-than="$CLEANUP_OLDER_THAN_HOURS"
